; SAMPLE region overlay - UBE 2.0
;
; The SAME two regions as "MyMod-CBBE 3BA.ini", built from UBE's own sliders.
; This pairing IS the pattern: ship one small file per body you support, all
; defining the same region names, and your mod keeps sending one call:
;
;     SLIF_Main.inflate(akActor, "My Mod", "region:weight", 1.4)
;
; A 3BA character and a UBE character in the same save then resolve different
; profiles, get different sliders, and your mod never learns either name.
;
; Slider names below are VERIFIED present in "UBE SE 2.0 Release Body.osp".
;
; No BHUNP sample ships here: its slider names could not be verified against a
; live body. To add one, open your body's .osp in a text editor, copy the
; exact <Slider name="..."> values, and save it as <YourMod>-BHUNP.ini with
; Profile= set to the BHUNP profile's Name=.

[Overlay]
Profile=UBE 2.0

[Weight]
FullScale=2.0
Morph1=BellyFatty
Morph1Max=0.5
Morph2=Juicy_body
Morph2Max=0.4
Morph3=HipsOuterBonesFatty
Morph3Max=0.3
Morph4=SoftBelly
Morph4Max=0.2

[MuscleMass]
FullScale=2.0
Morph1=SpineMuscles
Morph1Max=0.5
Morph2=PectoralisMuscles
Morph2Max=0.4
Morph3=Deltoidmuscles
Morph3Max=0.4
Morph4=HipsSideMuscles
Morph4Max=0.3

; UBE spells some sliders with a literal " n|p" or " p|n" suffix
; (e.g. "HipSize p|n"). Copy those verbatim, suffix included - it is part of
; the name, not notation.
