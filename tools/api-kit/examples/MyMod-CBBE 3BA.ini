; SAMPLE region overlay - CBBE 3BA
;
; Copy this next to your mod's other loose files so it installs to
;   Data\SLIFNG\Bodies\Regions\<YourMod>-CBBE 3BA.ini
; and rename it after YOUR mod. The filename is what keeps two mods from
; ever conflicting, so never ship one called "weight.ini" or "default.ini".
;
; Overlays are merged into the body profile they name, at load. They do NOT
; replace the profile, so shipping one does not override the body the user
; installed - which is the whole reason this file type exists.
;
; Slider names below are VERIFIED present in CBBE 3BA Reference.osp. A slider
; a body does not have is silently dropped by skee, so a wrong name degrades
; to "nothing happens", never to an error - which makes it hard to spot.

[Overlay]
; Which body profile this applies to: the Name= at the top of the profile
; (see Data\SLIFNG\Bodies\*.ini). "*" would mean every body, which is rarely
; right - slider names differ per body family.
Profile=CBBE 3BA

; ---------------------------------------------------------------------------
; A CONVENTIONAL region. Prefer reusing an existing name over inventing one:
; if two mods both mean "this character is heavier", both should drive
; "region:weight" so the user's calculation type can arbitrate between them.
; ---------------------------------------------------------------------------
[Weight]
; The node-scale DEVIATION at which the sliders below reach their Max.
; 2.0 means a consumer sending 3.0 (deviation 2.0) gets the full effect,
; and the common 1.4 (deviation 0.4) gets 20% of each slider.
FullScale=2.0
Morph1=ChubbyWaist
Morph1Max=0.6
Morph2=ChubbyButt
Morph2Max=0.4
Morph3=ChubbyArms
Morph3Max=0.3
Morph4=ChubbyLegs
Morph4Max=0.3
Morph5=BreastGravity2
Morph5Max=0.2

; ---------------------------------------------------------------------------
; A NEW region, for a concept no existing name covers. Your mod then calls:
;
;     SLIF_Main.inflate(akActor, "My Mod", "region:musclemass", 1.4)
;
; Guard it, because a region has no skeleton bone to fall back on - on a body
; with no such section the call is a no-op visible only in the log:
;
;     if SLIFNG.HasTarget(akActor, "region:musclemass")
;         SLIF_Main.inflate(akActor, "My Mod", "region:musclemass", 1.4)
;     endif
; ---------------------------------------------------------------------------
[MuscleMass]
FullScale=2.0
Morph1=MuscleAbs
Morph1Max=0.7
Morph2=MuscleArms
Morph2Max=0.5
Morph3=MuscleLegs
Morph3Max=0.5
Morph4=MuscleButt
Morph4Max=0.3

; Up to 16 MorphN per section and the numbering must not skip. A negative
; Max runs the slider in reverse. Section names are case-insensitive, so
; [MuscleMass] answers "region:musclemass".
