; SLIF NG body profile - THE FALLBACK for every actor whose body is not
; detected some other way.
;
; You chose this file in the installer. It carries no matcher: it is simply
; "the body this game uses". UBE is the exception and ships separately - it is
; race-based, so it can be matched per ACTOR and overrides this file for UBE
; characters even in the same save.
;
; To change body later WITHOUT reinstalling, replace this one file with another
; profile (they live in Data/SLIFNG/Bodies) or edit the slider names below.
;
; FORMAT
;   FullScale = the node-scale DEVIATION at which the sliders below reach their
;               Max (Beeing Female NG's own SLIF magnitudes: 7.5 belly, 10 breasts)
;   MorphN    = BodySlide slider name, EXACT case, as it appears in the body's
;               .osp <Slider name="..."> - that is what lands in morphs.tri
;   MorphNMax = that slider's value at FullScale
;
;   A key you do NOT list has no usable morph on this body, so SLIF NG drives it
;   with a skeleton NODE scale instead. That is the supported way to say
;   "this body cannot morph that" - skee offers no way to ask.

[Profile]
Name=BHUNP

; Names taken from reference SLIF's own UUNP mapping
; (StorageUtilData/SexLab Inflation Framework/bodymorphs/001_UUNP_Bodymorphs.json).
; BHUNP is UUNP-derived, so that table is the best available source short of a
; BHUNP install to read the .osp from - it is what SLIF itself drove UUNP with
; for years. Still worth confirming against your own body's
;   <BHUNP mod>/CalienteTools/BodySlide/SliderSets/<body>.osp
; if a shape looks wrong.

[slif_belly]
FullScale=7.5
; PregnancyBelly appears in ALL THREE of SLIF's body tables (Default, UUNP,
; CBBE SE) - the one slider name that is safe everywhere.
Morph1=PregnancyBelly
Morph1Max=1.0

[slif_breast]
FullScale=10.0
; Mirrors Beeing Female NG's own BHUNP BodyMorph profile, so the same character
; looks the same whichever backend drives her. All three VERIFIED present in
; SLIF's UUNP table.
;
; Note BreastsSSH is a UUNP-family name and does NOT exist on CBBE 3BA, just as
; 3BA's BreastsNewSH does not exist on UUNP - that split is exactly why one
; hardcoded mapping cannot serve both bodies.
Morph1=BreastsSSH
Morph1Max=0.4
Morph2=DoubleMelon
Morph2Max=0.25
; POSITIVE here, unlike the CBBE 3BA profile which uses -0.2. BreastsSmall makes
; breasts smaller, so +0.1 slightly counteracts the growth. Copied deliberately
; from BF NG's BHUNP profile; flip the sign if the shape reads wrong on UUNP.
Morph3=BreastsSmall
Morph3Max=0.1

; slif_butt and slif_scrotum: node-scaled, see the note above.
