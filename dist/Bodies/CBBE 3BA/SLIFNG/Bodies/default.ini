; SLIF NG body profile - THE FALLBACK for every actor whose body is not
; detected some other way.
;
; You chose this file in the installer. It carries no matcher: it is simply
; "the body this game uses". UBE is the exception and ships separately - it is
; race-based, so it can be matched per ACTOR and overrides this file for UBE
; characters even in the same save.
;
; To change body later WITHOUT reinstalling, replace this one file with another
; profile (they live in Data/SLIFNG/Bodies) or edit the slider names below.
;
; FORMAT
;   FullScale = the node-scale DEVIATION at which the sliders below reach their
;               Max (Beeing Female NG's own SLIF magnitudes: 7.5 belly, 10 breasts)
;   MorphN    = BodySlide slider name, EXACT case, as it appears in the body's
;               .osp <Slider name="..."> - that is what lands in morphs.tri
;   MorphNMax = that slider's value at FullScale
;
;   A key you do NOT list has no usable morph on this body, so SLIF NG drives it
;   with a skeleton NODE scale instead. That is the supported way to say
;   "this body cannot morph that" - skee offers no way to ask.

[Profile]
Name=CBBE 3BA

[slif_belly]
FullScale=7.5
; VERIFIED present in CBBE 3BA Reference.osp
Morph1=PregnancyBelly
Morph1Max=1.0

[slif_breast]
FullScale=10.0
; Blends four sliders for a fuller, heavier shape rather than maxing one -
; the same combination Beeing Female NG's own CBBE 3BA profile uses.
; All four VERIFIED present in CBBE 3BA Reference.osp.
Morph1=BreastsNewSH
Morph1Max=0.4
Morph2=DoubleMelon
Morph2Max=0.25
Morph3=BreastsSmall
Morph3Max=-0.2
Morph4=BreastWidth
Morph4Max=-0.1

[slif_butt]
; Butt consumers send far smaller values than belly/breast ones: Estrus Chaurus
; tops out at node scale 2.0 by default, so a deviation of 1.0 is already "a
; big butt". Hence FullScale 1.0, not the 7.5 / 10 above.
FullScale=1.0
; VERIFIED present in "SE 3BBB Amazing.osp" (the CBBE 3BA body slider set), and
; its DIRECTION is verified against the body's diff data in "SE 3BBB Body
; Amazing v2.osd": a POSITIVE value is the bigger one (the cheek apex moves
; about 1.1 units rearward at 1.0).
;
; BigButt rather than Butt on purpose. Butt grows the cheek on this body but is
; an INVERTED slider on BHUNP, where a positive value SHRINKS it. BigButt points
; the same way on both.
Morph1=BigButt
Morph1Max=1.0
; The magnitude is a starting point set from that slider data, not from an
; in-game pass, and it is subtler than the bone scale it replaces. Other
; verified 3BA butt sliders worth blending in if the shape needs it:
;   AppleCheeks   the strongest, about 1.6 units rearward at 1.0
;   ChubbyButt    about as deep as BigButt, also wider and higher
;   RoundAss      a small extra projection
;   ButtShape2    drops the cheek (use a NEGATIVE Max for lift)
;   ButtSmall     shrinks (use a NEGATIVE Max to grow)
;
; Delete the whole section to put butts back on bone scaling (NPC L Butt +
; NPC R Butt), which every outfit follows whether or not it was built with
; morphs.

; slif_scrotum is deliberately absent: no standard slider set covers a
; scrotum, so it stays node-scaled.

; CUSTOM REGIONS (SLIF NG extension): any OTHER section name defines a
; semantic region a consumer can drive with the key "region:<section>" -
; same format as above, value 1.0 = neutral. Example a weight-gain consumer
; (SGO4) would use; uncomment and tune to enable:
;[Weight]
;FullScale=2.0
;Morph1=ChubbyWaist
;Morph1Max=0.6
;Morph2=ChubbyButt
;Morph2Max=0.4
;Morph3=BreastGravity2
;Morph3Max=0.2
