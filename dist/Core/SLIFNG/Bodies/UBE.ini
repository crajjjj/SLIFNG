; SLIF NG body profile - UBE 2.0 (Ultimate Body Enhancer)
;
; UBE is RACE-based: it ships its own playable races with their own body model
; and its own ~200 BodySlide sliders, and it coexists with 3BA/BHUNP in one load
; order. That is exactly why profiles resolve PER ACTOR - a global body setting
; would be wrong by construction here.
;
; SLIDER NAMES VERIFIED against
;   UBE 2.0/CalienteTools/Bodyslide/SliderSets/UBE SE 2.0 Release Body.osp
; (the <Slider name="..."> values are what BodySlide exports into morphs.tri,
;  which is what skee/RaceMenu matches on).
;
; This profile ALWAYS installs, whatever body you picked in the installer: UBE
; is matched per ACTOR by race, so a UBE character and a 3BA character can
; coexist in one save and each gets the right sliders. The installer's choice is
; only the FALLBACK for everyone else.
;
; Race matcher verified against UBE_AllRace.esp, whose race EditorIDs are
; 00UBE_BretonRace, 00UBE_DarkElfRace, 00UBE_CustomRace01, ... - "UBE_" is
; specific enough not to catch unrelated races by accident.

[Profile]
Name=UBE 2.0
; RACE ONLY, deliberately. A Plugin= matcher here would be install-wide - it
; says "UBE is installed", not "this actor is a UBE race" - so it claimed every
; Nord and Imperial in any load order that had UBE at all (issue #1). The race
; EditorID is the only per-actor evidence, and it is decisive on its own.
Race=UBE_

[slif_belly]
FullScale=7.5
; VERIFIED present on UBE - it happens to share CBBE's name for this one.
Morph1=PregnancyBelly
; 1.35, not 1.0: UBE's slider is the weaker one. Measured on the diff data in
; "UBE SE 2.0 Release Body.osd" against "SE 3BBB Body Amazing v2.osd", the belly
; apex moves 8.2 units forward at 1.0 on UBE and 11.1 on CBBE 3BA, so at 1.0 a
; UBE belly ended about a quarter flatter than a 3BA one at the same pregnancy.
; 8.2 x 1.35 matches 3BA's projection. Set from that data, not from an in-game
; pass; UBE's morph also hangs lower (2.9 units down at 1.0, against 1.5).
Morph1Max=1.35

[slif_breast]
FullScale=10.0
; UBE has NEITHER BreastsSH NOR BreastsNewSH - those are CBBE-family names, and
; using them here silently did nothing (skee stores any name and only drops it
; later inside ApplyBodyMorphs). UBE's own growth slider is BreastsBigger.
Morph1=BreastsBigger
Morph1Max=1.0
; Other verified UBE breast sliders worth blending in if the shape needs it:
;   Juicy_breasts, Breasts_Perky, Big_SaggyBreasts, BreastUnderCurve,
;   Breast Diameter_big, BreastsSmaller (use a NEGATIVE Max to counteract)

[slif_butt]
; Butt consumers send far smaller values than belly/breast ones: Estrus Chaurus
; tops out at node scale 2.0 by default, so a deviation of 1.0 is already "a
; big butt". Hence FullScale 1.0, not the 7.5 / 10 above.
FullScale=1.0
; VERIFIED present on UBE, and its DIRECTION is verified against the slider's
; diff data in "UBE SE 2.0 Release Body.osd": the " p|n" suffix does NOT mean
; inverted - a POSITIVE value is the bigger one (the cheek apex moves about 1.4
; units rearward at 1.0).
Morph1=GluteSize p|n
Morph1Max=1.0
; The magnitude is a starting point set from that slider data, not from an
; in-game pass, and it is subtler than the bone scale it replaces. Other
; verified UBE glute sliders worth blending in if the shape needs it:
;   GlutesUpperDepth p|n  more depth on the upper cheek
;   GluteusDefinition     more projection, sits slightly lower
;   GluteLower            fuller lower cheek
;   GluteSpread p|n       sideways cheek spread only, adds no volume
;   GluteStretch p|n      drops the cheek (use a NEGATIVE Max for lift)
;   GluteTwistX p|n       a sideways twist, NOT a size slider
;
; Delete the whole section to put UBE butts back on bone scaling (NPC L Butt +
; NPC R Butt, both present on the UBE body), which every outfit follows whether
; or not it was built with morphs.
