; SLIF NG body profile - UBE 2.0 (Ultimate Body Enhancer)
;
; UBE is RACE-based: it ships its own playable races with their own body model
; and its own ~200 BodySlide sliders, and it coexists with 3BA/BHUNP in one load
; order. That is exactly why profiles resolve PER ACTOR - a global body setting
; is wrong by construction here.
;
; The race matcher is the reliable signal; the plugin matcher only catches a UBE
; install whose races are named differently.
;
; NOTE: the slider names below are UBE's CBBE-compatible ones. UBE ships many
; body-specific sliders - if a shape looks wrong, replace these with the exact
; names from UBE's BodySlide and keep FullScale as-is.

[Profile]
Name=UBE 2.0
Race=UBE
Plugin=UBE_AllRace.esp

[slif_belly]
FullScale=7.5
Morph1=PregnancyBelly
Morph1Max=1.0

[slif_breast]
FullScale=10.0
Morph1=BreastsSH
Morph1Max=1.0
