; SLIF NG body profile - FALLBACK
;
; Picked when no other profile matches. Ships the classic CBBE-family sliders,
; which most bodies provide, so a bare install still works.
;
; FORMAT
;   [Profile]  Name   = shown in the MCM Actor page
;              Race   = substring matched against the actor's race EditorID
;              Plugin = a plugin whose presence selects this profile (repeatable)
;              default.ini needs neither matcher - it IS the fallback.
;
;   [<slif key>] one section per vocabulary key:
;              FullScale = the node-scale DEVIATION at which the sliders below
;                          reach their Max (Beeing Female NG's own SLIF
;                          magnitudes: 7.5 belly, 10.0 breasts)
;              MorphN    = BodySlide slider name, EXACT case
;              MorphNMax = that slider's value at FullScale
;              Up to 16 sliders per key; they blend together.
;
;   A key you do NOT list has no usable morph on this body, and SLIF NG drives
;   it with a skeleton NODE scale instead. That is the intended way to say
;   "this body cannot morph that" - there is no way to ask skee.

[Profile]
Name=Default (CBBE family)

[slif_belly]
FullScale=7.5
Morph1=PregnancyBelly
Morph1Max=1.0

[slif_breast]
FullScale=10.0
; Two CANDIDATES on purpose: BreastsNewSH is verified present on CBBE 3BA,
; while BreastsSH is not (it belongs to older/plain CBBE slider sets). A slider
; a body does not have contributes nothing, so listing both makes this fallback
; work across more bodies - at the cost that a body having BOTH gets roughly
; double the effect. Beeing Female NG's own default profile makes the same
; trade. A body-specific profile should name exactly one.
Morph1=BreastsSH
Morph1Max=1.0
Morph2=BreastsNewSH
Morph2Max=1.0

; slif_butt and slif_scrotum are deliberately absent: no standard slider set
; covers a scrotum, and butt node scaling is closer to what consumers expect.
