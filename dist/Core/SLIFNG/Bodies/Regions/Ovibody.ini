; SLIF NG region overlay - Ovibody (the oviposition belly: a clutch of eggs)
;
; Ovibody (LoversLab 44392) is a BodySlide body with egg sliders on the belly,
; Oviposition_1..6, shipped for CBBE 3BA, GT Softbody and UBE 2.0 under the
; SAME slider names, which is why one overlay serves every profile. Nothing
; shows unless the body was built from an Ovibody set with Build Morphs on;
; without those sliders in the morphs.tri skee drops the names silently.
;
; Consumers send the region like a node key, 1.0 = no eggs:
;
;     SLIF_Main.inflate(akActor, "My Mod", "region:oviposition", 1.0 + progress)
;
; with progress 0..1 (FullScale 1.0 below), so 2.0 is the full clutch and the
; eggs track whatever the mod already knows about its pregnancy - Estrus
; Chaurus and its spider add-on send the belly's share of its maximum.
;
; The six sliders are groups of eggs stacked up the belly (1 = one egg just
; above the pubis, 6 = three eggs at the flanks under the navel), measured on
; the Ovibody 3BA data: they do not overlap, so all six at 1.0 is the clean
; full clutch. Each group fills over its own WINDOW of the range, lowest first
; and overlapping the next, so the clutch forms from the bottom up instead of
; twenty flat lumps rising together.

[Overlay]
Profile=*

[Oviposition]
FullScale=1.0
Morph1=Oviposition_1
Morph1Max=1.0
Morph1Start=0.0
Morph1End=0.25
Morph2=Oviposition_2
Morph2Max=1.0
Morph2Start=0.15
Morph2End=0.4
Morph3=Oviposition_3
Morph3Max=1.0
Morph3Start=0.3
Morph3End=0.55
Morph4=Oviposition_4
Morph4Max=1.0
Morph4Start=0.45
Morph4End=0.7
Morph5=Oviposition_5
Morph5Max=1.0
Morph5Start=0.6
Morph5End=0.85
Morph6=Oviposition_6
Morph6Max=1.0
Morph6Start=0.75
Morph6End=1.0
