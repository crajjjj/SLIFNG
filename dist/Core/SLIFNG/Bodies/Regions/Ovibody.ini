; SLIF NG region overlay - Ovibody (the oviposition belly: a clutch of eggs)
;
; Ovibody (LoversLab 44392) is a BodySlide body with egg sliders on the belly,
; shipped for CBBE 3BA, GT Softbody and UBE 2.0 under the SAME slider names,
; which is why one overlay serves every profile. Its default "Separate"
; option has twenty single eggs, Egg_1..Egg_20; the "Simple" option has only
; the six groups Oviposition_1..6 (see the end of this file). Nothing shows
; unless the body was built from an Ovibody set with Build Morphs on; without
; the sliders in the morphs.tri skee drops the names silently.
;
; One key, two phases. Consumers send it like a node key:
;
;     1.0 .. 2.0   the clutch GROWS: every egg together, 2.0 = full size
;     2.0 .. 3.0   the eggs LEAVE: one at a time, lowest first, 3.0 = none left
;
;     SLIF_Main.inflate(akActor, "My Mod", "region:oviposition", 1.0 + progress)
;     SLIF_Main.inflate(akActor, "My Mod", "region:oviposition", 2.0 + laid)
;
; Estrus Chaurus and its spider add-on send the belly's share of its maximum
; while incubating, then one egg's share per egg placed on the ground while
; giving birth.
;
; How: every egg rises over the whole first unit (Start 0, End 1, so it holds
; full size above 2.0 instead of growing on), and switches OFF over its own
; twentieth of the second unit. The eggs are numbered up the belly (Egg_1
; just above the pubis, Egg_18..20 at the flanks under the navel), measured
; on the Ovibody 3BA data; they do not overlap, so all twenty at 1.0 is the
; clean full clutch.

[Overlay]
Profile=*

[Oviposition]
FullScale=1.0
Morph1=Egg_1
Morph1Max=1.0
Morph1Start=0.0
Morph1End=1.0
Morph1OffStart=1.0
Morph1OffEnd=1.05
